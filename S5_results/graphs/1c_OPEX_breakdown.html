    } else {
        selectedCat = cat;
        var traces = techData[cat] || [];
        Plotly.react('chart-detail', traces, Object.assign({}, detailLayout, {
            title: Object.assign({}, detailLayout.title, {text: '<b>' + cat + '</b> — technologies'})
        }));
    }
    return false;
});
