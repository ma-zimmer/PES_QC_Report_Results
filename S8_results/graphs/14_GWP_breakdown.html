    if (overlayNames.indexOf(sec) >= 0) return;
    var l2El = document.getElementById('chart-l2');
    if (sec === selectedSector) {
        selectedSector = null;
        l2El.style.display = 'none';

        selectedSector = sec;
        var traces = l2Data[sec] || [];
