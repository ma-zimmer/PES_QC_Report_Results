        l2El.style.display = 'none';
    } else {
        selectedSector = sec;
        var traces = l2Data[sec] || [];
        l2El.style.display = 'block';
        Plotly.newPlot('chart-l2', traces,
            Object.assign({}, l2Layout,
                {title: sec + ' — contributing technologies [Mt CO₂-eq./y, sector share]'}));
    }
    return false;
});
</script></body></html>
